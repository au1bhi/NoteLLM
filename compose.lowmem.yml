# Low-memory production override: serve the frontend SPA from a named volume
# instead of building it inside the image.
#
# Why: the SPA build (`bun install` + `vite build`) needs ~2GB+ RAM and OOMs on
# small servers (e.g. 1–2GB Aliyun). With this override the `frontend` image is
# just nginx + the SPA route config (fast, tiny build), and the pre-built
# `dist/` is injected into the `frontend-dist` volume by install.sh — either
# downloaded from a GitHub release / FRONTEND_DIST_URL, or uploaded by the
# developer who built it locally (`bash scripts/build-frontend-dist.sh`).
#
# Activate: `bash install.sh --prod --low-mem` (or auto-detected on <2GB RAM).
# Local development keeps the in-image build (compose.override.yml) — dev
# machines have the RAM and benefit from zero extra steps.
services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.nginx
      # !reset drops the base compose.yml SPA-build args (BUN_IMAGE, NODE_ENV,
      # VITE_API_URL, NPM_REGISTRY); keep only the nginx base image (mirror-aware
      # for restricted networks).
      args: !reset
        NGINX_IMAGE: ${REGISTRY_MIRROR:-}library/nginx:1
    # The nginx image already serves /usr/share/nginx/html; mounting the
    # pre-built SPA there decouples the static assets from the image so the
    # server never runs the heavy frontend build.
    volumes:
      - frontend-dist:/usr/share/nginx/html

  backend:
    volumes:
      - ./backend/app:/app/backend/app:ro

  scheduler:
    volumes:
      - ./backend/app:/app/backend/app:ro

volumes:
  frontend-dist:
