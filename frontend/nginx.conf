server {
  listen 80;

  # Security headers (also sent on error responses via `always`).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  # Same-origin API proxy: the SPA calls /api/v1/... on this host and nginx
  # forwards to the backend service, so a fresh `docker compose up` works
  # without configuring VITE_API_URL or cross-origin CORS.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Relay the real client IP: through the Cloudflare Tunnel the direct peer
    # is 127.0.0.1 (cloudflared), so without this every user would share one
    # rate-limit bucket. Cf-Connecting-Ip is set by Cloudflare edge and cannot
    # be spoofed by clients.
    set $xff $proxy_add_x_forwarded_for;
    if ($http_cf_connecting_ip != "") {
        set $xff $http_cf_connecting_ip;
    }
    proxy_set_header X-Forwarded-For $xff;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /docs {
    return 302 /docs/;
  }

  location /docs/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    set $xff $proxy_add_x_forwarded_for;
    if ($http_cf_connecting_ip != "") {
        set $xff $http_cf_connecting_ip;
    }
    proxy_set_header X-Forwarded-For $xff;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /redoc {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    set $xff $proxy_add_x_forwarded_for;
    if ($http_cf_connecting_ip != "") {
        set $xff $http_cf_connecting_ip;
    }
    proxy_set_header X-Forwarded-For $xff;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
