server {
  listen 8080;
  # Dedicated loopback-mapped origin for cloudflared. Only this listener may
  # convert Cloudflare's client header into the generic trusted XFF channel.
  listen 8081;

  # Security headers (also sent on error responses via `always`).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Keep inline/eval scripts blocked, but provide a per-response nonce for
  # Cloudflare Bot Fight Mode's JavaScript Detection. Cloudflare parses the
  # nonce from the CSP response header and adds it to the inline challenge
  # snippet it injects at the edge. Web Analytics loads its SRI-protected
  # external beacon from static.cloudflareinsights.com and reports to the
  # same-origin /cdn-cgi/rum endpoint (already covered by connect-src 'self').
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  # Same-origin API proxy: the SPA calls /api/v1/... on this host and nginx
  # forwards to the backend service, so a fresh `docker compose up` works
  # without configuring VITE_API_URL or cross-origin CORS.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Normal ingress preserves the proxy chain. The dedicated Tunnel listener
    # replaces it with Cloudflare's edge-verified address. Never forward the
    # provider-specific header itself to the application.
    set $xff $proxy_add_x_forwarded_for;
    if ($server_port = 8081) {
        set $xff $http_cf_connecting_ip;
    }
    proxy_set_header X-Forwarded-For $xff;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /docs {
    return 302 /docs/;
  }

  location /docs/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    set $xff $proxy_add_x_forwarded_for;
    if ($server_port = 8081) {
        set $xff $http_cf_connecting_ip;
    }
    proxy_set_header X-Forwarded-For $xff;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /redoc {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    set $xff $proxy_add_x_forwarded_for;
    if ($server_port = 8081) {
        set $xff $http_cf_connecting_ip;
    }
    proxy_set_header X-Forwarded-For $xff;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
