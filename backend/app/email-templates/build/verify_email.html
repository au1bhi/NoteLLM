<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>验证你的邮箱</title>
    <style>
      /* Outlook table fixes */
      body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
      table, td { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
      img { border: 0; line-height: 100%; outline: none; text-decoration: none; }
      a { text-decoration: none; }
      @media only screen and (max-width: 600px) {
        .container { width: 100% !important; }
        .content { padding: 32px 24px !important; }
        .btn { display: block !important; width: 100% !important; box-sizing: border-box; }
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background-color:#f4efe4;">
    <div style="background-color:#f4efe4;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4efe4;">
        <tr>
          <td align="center" style="padding:40px 16px;">
            <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:600px;background-color:#fffdf7;border:1px solid #e6dcc8;border-radius:12px;">
              <tr>
                <td class="content" style="padding:40px 32px;">
                  <!-- Brand header -->
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                    <tr>
                      <td align="center" style="padding-bottom:28px;">
                        <span style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;color:#8a4a20;letter-spacing:0.5px;">{{ project_name }}</span>
                      </td>
                    </tr>
                    <tr>
                      <td style="padding-bottom:24px;">
                        <h1 style="margin:0;font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;font-size:22px;line-height:1.4;color:#3a2f26;text-align:center;">验证你的邮箱</h1>
                      </td>
                    </tr>
                    <tr>
                      <td style="padding-bottom:16px;">
                        <p style="margin:0;font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;font-size:15px;line-height:1.7;color:#5c5245;text-align:center;">你好，欢迎使用 {{ project_name }}！<br />请点击下方按钮，确认 {{ email }} 属于你本人：</p>
                      </td>
                    </tr>
                    <tr>
                      <td align="center" style="padding:12px 0 24px;">
                        <a href="{{ link }}" class="btn" style="display:inline-block;background-color:#a44a20;color:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;font-size:15px;font-weight:600;line-height:1;padding:14px 32px;border-radius:8px;">验证邮箱</a>
                      </td>
                    </tr>
                    <tr>
                      <td style="padding-bottom:16px;">
                        <p style="margin:0;font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;line-height:1.7;color:#8b8072;text-align:center;">如果按钮无法点击，请将以下链接复制到浏览器地址栏：</p>
                        <p style="margin:6px 0 0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#6b6255;text-align:center;word-break:break-all;"><a href="{{ link }}" style="color:#8a4a20;">{{ link }}</a></p>
                      </td>
                    </tr>
                    <tr>
                      <td style="padding-bottom:8px;">
                        <p style="margin:0;font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;font-size:12px;line-height:1.7;color:#8b8072;text-align:center;">验证链接将在 {{ valid_hours }} 小时内有效。如果过期，可登录后在提示中重新发送。</p>
                      </td>
                    </tr>
                    <tr>
                      <td style="padding:0 0 20px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                          <tr>
                            <td style="border-top:1px solid #e9e0cf;font-size:0;line-height:0;height:1px;">&nbsp;</td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <p style="margin:0;font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;font-size:12px;line-height:1.7;color:#a09485;text-align:center;">如果你没有注册 {{ project_name }}，请忽略这封邮件，你的邮箱不会发生任何变更。<br />此邮件由系统自动发送，请勿直接回复。</p>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
