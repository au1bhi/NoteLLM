services:

  # Local services bind to loopback ports (frontend 5173, backend 8000).
  # Optional Traefik hostnames are only for proxy testing; primary URLs stay
  # http://localhost:5173 and http://localhost:8000.
  proxy:
    image: ${REGISTRY_MIRROR:-}traefik:3.6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Loopback-only: the local dev Traefik must never be internet-reachable.
      - "127.0.0.1:8081:80"
      - "127.0.0.1:8090:8080"
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Add a constraint to only use services with the label for this stack
      - --providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log
      # Enable the Dashboard and API
      - --api
    labels:
      # Enable Traefik for this service, to make it available in the public network
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      # Dummy https-redirect middleware that doesn't really redirect, only to
      # allow running it locally
      - traefik.http.middlewares.https-redirect.contenttype.autodetect=false
      # Dummy admin-auth so production's adminer label resolves locally too
      # (user "local" / password "local"; local adminer is reachable directly
      # at http://localhost:8080, bypassing Traefik). {SHA} avoids `$` in the
      # value, which Docker Compose would otherwise treat as interpolation.
      - traefik.http.middlewares.admin-auth.basicauth.users=local:{SHA}k5u0agTDZAyMQn6SsbVX6ILi0qA=
    networks:
      - traefik-public
      - default

  db:
    restart: "no"
    ports:
      # Loopback-only — never expose Postgres on the network.
      # POSTGRES_PORT remains the container port (5432). Change only this host
      # port when another local stack already occupies 5433.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  adminer:
    restart: "no"
    ports:
      - "127.0.0.1:8080:8080"

  backend:
    restart: "no"
    ports:
      # Loopback-only — the dev backend must never be internet-reachable.
      - "127.0.0.1:8000:8000"
    build:
      context: .
      dockerfile: backend/Dockerfile
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - bash
      - scripts/start-service.sh
      - fastapi
      - run
      - --reload
      - "app/main.py"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
  frontend:
    restart: "no"
    ports:
      - "127.0.0.1:5173:80"
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Empty → same-origin /api (nginx proxies to the backend service),
        # so a fresh `docker compose up` needs no CORS or published port.
        VITE_API_URL: ""
        NODE_ENV: development

networks:
  traefik-public:
    # For local dev, don't expect an external Traefik network
    external: false
