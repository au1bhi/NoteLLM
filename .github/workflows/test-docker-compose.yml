name: Test Docker Compose

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Prepare CI environment
        id: prepare
        run: cp .env.example .env
      - name: Validate Docker Compose configuration
        run: |
          docker compose config --quiet
          POSTGRES_HOST_PORT=55439 docker compose config --format json |
            jq -e '.services.db.ports[] | select(.host_ip == "127.0.0.1" and .published == "55439" and .target == 5432)'
      - name: Build application images
        run: docker compose build backend frontend
      - name: Start application stack
        run: docker compose up -d --wait backend frontend
      - name: Test backend is up
        run: >-
          curl --fail --silent --show-error --retry 5 --retry-all-errors
          --retry-delay 2 http://127.0.0.1:8000/api/v1/utils/health-check/
      - name: Test backend dependencies are ready
        run: >-
          curl --fail --silent --show-error --retry 5 --retry-all-errors
          --retry-delay 2 http://127.0.0.1:8000/api/v1/utils/readiness-check/
      - name: Verify migrations are current and repeatable
        run: |
          docker compose exec -T backend alembic current --check-heads
          docker compose run --rm prestart
          test "$(docker compose exec -T db psql -U postgres -d app -Atc "SELECT to_regclass('public.rate_limit_bucket')")" = "rate_limit_bucket"
      - name: Test frontend is up
        run: >-
          curl --fail --silent --show-error --retry 5 --retry-all-errors
          --retry-delay 2 http://127.0.0.1:5173/ > /dev/null
      - name: Show container logs on failure
        if: ${{ failure() && steps.prepare.outcome == 'success' }}
        run: docker compose logs --no-color
      - name: Stop application stack
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: docker compose down -v --remove-orphans
