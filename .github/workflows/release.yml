name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Build install.sh frontend asset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
          no-cache: true
      - name: Build versioned frontend archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/build-frontend-dist.sh
          asset="frontend-dist-${RELEASE_TAG}.tar.gz"
          mv frontend-dist.tar.gz "$asset"
          # install.sh parses a bare 64-hex hash; rewrite the checksum file in
          # that format (the build script's copy embeds the old file name).
          sha256sum "$asset" | cut -d ' ' -f 1 > "$asset.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          asset="frontend-dist-${RELEASE_TAG}.tar.gz"
          gh release create "$RELEASE_TAG" \
            "$asset#NoteLLM 预构建前端" \
            "$asset.sha256#SHA-256 校验和" \
            --verify-tag \
            --generate-notes \
            --title "NoteLLM ${RELEASE_TAG}"
